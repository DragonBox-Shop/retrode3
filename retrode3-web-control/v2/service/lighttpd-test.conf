# Standalone laboratory configuration. Not installed by Debian packages.
# Launch unprivileged; use an SSH tunnel to 127.0.0.1:8080.
server.modules = ( "mod_access", "mod_proxy" )
server.bind = "127.0.0.1"
server.port = 8080
server.document-root = "/var/www/retrode3-lighttpd"
server.max-connections = 16
server.max-request-size = 4160
server.max-read-idle = 20
server.max-write-idle = 20
server.stream-request-body = 2
server.stream-response-body = 2
mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".css" => "text/css; charset=utf-8",
  ".js" => "application/javascript; charset=utf-8",
  ".json" => "application/json; charset=utf-8"
)
url.access-deny = ( ".php", ".inc" )
$HTTP["url"] =~ "^(/$|/index\\.html$|/api/)" {
  proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8765, "check-local" => "disable" ) ) )
}
# Only the static frontend assets may be served directly.
else $HTTP["url"] !~ "^/(assets|locales)/" {
  url.access-deny = ( "" )
}
