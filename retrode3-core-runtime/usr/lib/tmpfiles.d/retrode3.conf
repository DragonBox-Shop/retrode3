# Shared Retrode3 cartridge bus lock. /run is volatile; systemd-tmpfiles
# restores the protected directory and reusable lock inode at every boot.
# CLI uses open(O_CREAT) and flock(), but never needs to mkdir its parent.
# Keep the directory root-owned/non-writable by the web service.
d /run/lock/retrode3 0755 root root -
f /run/lock/retrode3/bus.lock 0660 root www-data -
z /run/lock/retrode3/bus.lock 0660 root www-data -
