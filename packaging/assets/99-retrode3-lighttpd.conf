server.modules += ( "mod_proxy" )
server.document-root := "/var/www/retrode3-lighttpd"
server.max-connections = 16
server.max-request-size = 4160
server.max-read-idle = 20
server.max-write-idle = 20
server.stream-request-body = 2
server.stream-response-body = 2
url.access-deny += ( ".php" )
$HTTP["url"] =~ "^(/$|/index[.]html$|/api/)" {
  proxy.replace-http-host = "disable"
  proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8765 ) ) )
}
# Only the static frontend assets may be served directly.
else $HTTP["url"] !~ "^/(assets|locales)/" {
  url.access-deny = ( "" )
}
