# Retrode3 low-memory Apache 2.4 prefork settings (Debian 8 / PHP 5).
# Keep this separate from Debian's mpm_prefork.conf so package upgrades
# do not replace the distribution file or erase administrator changes.
# Debian apache2.conf includes conf-enabled/*.conf after mods-enabled/*.conf.
# Only relevant with prefork, which is required by the installed mod_php5.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          1
    MaxSpareServers          2
    MaxRequestWorkers        4
    MaxConnectionsPerChild   100
</IfModule>
