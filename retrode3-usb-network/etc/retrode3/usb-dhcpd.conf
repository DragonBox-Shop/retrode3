# Retrode3 USB CDC-NCM point-to-point network
# Device: 172.31.255.1/30; host: 172.31.255.2/30.
# Do NOT advertise a default router or DNS server to the PC.

authoritative;

subnet 172.31.255.0 netmask 255.255.255.252 {
    range 172.31.255.2 172.31.255.2;
    default-lease-time 600;
    max-lease-time 7200;
}
