name: Build actual mipsel Debian test candidates

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['apt-*']
    paths:
      - 'packaging/**'
      - 'buildserver/**'
      - '.github/workflows/debian-mipsel-candidates.yml'
  pull_request:
    branches: [master]
    paths:
      - 'packaging/**'
      - 'buildserver/**'
      - '.github/workflows/debian-mipsel-candidates.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cross-build-offline-debs:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - name: Install pinned Debian cross-build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git ca-certificates make python3 gcc g++ dpkg-dev file binutils \
            gcc-mipsel-linux-gnu g++-mipsel-linux-gnu binutils-mipsel-linux-gnu
      - uses: actions/checkout@v4
      - name: Resolve latest OSCR branch and its Sanni submodule
        run: |
          set -eu
          OSCR_BRANCH="${{ github.base_ref || github.ref_name }}"
          git clone https://github.com/DragonBox-Shop/retrode3-oscr.git "$RUNNER_TEMP/retrode3-oscr"
          if [ "${{ github.ref_type }}" = tag ]; then
            # Image checkpoints are tagged on develop. Use a tagged OSCR
            # snapshot, never the moving development HEAD for this test.
            OSCR_BRANCH=develop
            OSCR_TAG="$(git -C "$RUNNER_TEMP/retrode3-oscr" for-each-ref --merged refs/remotes/origin/develop --sort=-creatordate --count=1 --format='%(refname)' 'refs/tags/apt-*')"
            test -n "$OSCR_TAG"
            OSCR_COMMIT="$(git -C "$RUNNER_TEMP/retrode3-oscr" rev-parse "$OSCR_TAG^{commit}")"
          else
            case "$OSCR_BRANCH" in master|develop) ;; *) exit 1 ;; esac
            OSCR_COMMIT="$(git ls-remote --exit-code https://github.com/DragonBox-Shop/retrode3-oscr.git "refs/heads/$OSCR_BRANCH" | cut -f1)"
          fi
          git -C "$RUNNER_TEMP/retrode3-oscr" checkout --detach "$OSCR_COMMIT"
          git -C "$RUNNER_TEMP/retrode3-oscr" submodule update --init third_party/oscr-firmware
          SANNI_COMMIT="$(git -C "$RUNNER_TEMP/retrode3-oscr" rev-parse HEAD:third_party/oscr-firmware)"
          test "$(git -C "$RUNNER_TEMP/retrode3-oscr/third_party/oscr-firmware" rev-parse HEAD)" = "$SANNI_COMMIT"
          python3 - "$RUNNER_TEMP/source-lock.json" "$OSCR_COMMIT" "$SANNI_COMMIT" <<'PY'
          import json,sys
          with open("packaging/native-source-lock.json",encoding="utf-8") as f:
              lock=json.load(f)
          lock["oscr_commit"],lock["sanni_commit"]=sys.argv[2:]
          with open(sys.argv[1],"w",encoding="utf-8") as f:
              json.dump(lock,f)
          PY
          echo "RETRODE3_OSCR_BRANCH=$OSCR_BRANCH" >> "$GITHUB_ENV"
          echo "RETRODE3_OSCR_COMMIT=$OSCR_COMMIT" >> "$GITHUB_ENV"
      - name: Shared-core native mocks (host only)
        run: |
          make -C "$RUNNER_TEMP/retrode3-oscr" -f Makefile.migration test-all-shared-cores
      - name: Build target mipsel stage (not installed)
        run: |
          make -C "$RUNNER_TEMP/retrode3-oscr" -f Makefile.migration clean-migration
          make -C "$RUNNER_TEMP/retrode3-oscr" -f Makefile.migration \
            CC=mipsel-linux-gnu-gcc CXX=mipsel-linux-gnu-g++ \
            AR=mipsel-linux-gnu-ar test-release-stage
          bash buildserver/stage-oscr-plugins.sh "$RUNNER_TEMP/retrode3-oscr"
          file "$RUNNER_TEMP/retrode3-oscr/build/migration/stage/usr/bin/retrode3-cli"
          file "$RUNNER_TEMP/retrode3-oscr/build/migration/stage/usr/lib/retrode3/cores-available/"*.so
      - name: Build latest-OSCR MIPSEL Debian package candidates
        run: |
          RETRODE3_AUTO_VERSION=1 RETRODE3_FOLLOW_OSCR_BRANCH=1 \
            RETRODE3_OSCR_BRANCH="$RETRODE3_OSCR_BRANCH" \
            RETRODE3_VERSION_STAMP=20261123160000000000000 \
            SOURCE_DATE_EPOCH=1795132800 python3 packaging/build-debs.py \
            --source-lock "$RUNNER_TEMP/source-lock.json" \
            --oscr-source "$RUNNER_TEMP/retrode3-oscr" \
            --stage "$RUNNER_TEMP/retrode3-oscr/build/migration/stage" \
            --output build/debian-candidates
          python3 -c 'import json; p=json.load(open("build/debian-candidates/build-manifest.json")); assert p["oscr_commit"] == __import__("os").environ["RETRODE3_OSCR_COMMIT"] and set(["snes","md","nes"]).issubset(p["core_ids"]), p'
          for deb in build/debian-candidates/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
      - name: Upload test packages only, NOT a signed APT release
        uses: actions/upload-artifact@v4
        with:
          name: retrode3-develop-mipsel-debs-UNTESTED
          path: |
            build/debian-candidates/*.deb
            build/debian-candidates/build-manifest.json
          if-no-files-found: error
          retention-days: 14

  bookworm-mipsel-apt-install:
    # Real foreign-architecture APT dependency test; not a device acceptance.
    needs: cross-build-offline-debs
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Download exactly the untested MIPSEL Debian candidates
        uses: actions/download-artifact@v4
        with:
          name: retrode3-develop-mipsel-debs-UNTESTED
          path: build/apt-debs
      - name: Install foreign-architecture tools
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mmdebstrap arch-test qemu-user-static binfmt-support debian-archive-keyring xz-utils
          sudo update-binfmts --enable qemu-mipsel
          test -r /proc/sys/fs/binfmt_misc/qemu-mipsel
          grep -x enabled /proc/sys/fs/binfmt_misc/qemu-mipsel
      - name: Bootstrap real Bookworm MIPSEL and resolve all manifest packages
        run: |
          set -eux
          mkdir -p "$PWD/build/ci-rootfs-artifacts" "$PWD/build/ci-mipsel-rootfs"
          sudo env SOURCE_DATE_EPOCH=1795392000 \
            bash image/build-bookworm-rootfs.sh "$PWD/build/ci-rootfs-artifacts"
          sudo tar --numeric-owner -xJf \
            build/ci-rootfs-artifacts/retrode3-bookworm-mipsel-rootfs.tar.xz \
            -C build/ci-mipsel-rootfs
          ROOT="$PWD/build/ci-mipsel-rootfs"
          # The regular rootfs archive intentionally contains no device nodes.
          # Provide only the same five safe character devices used by the
          # rootless package image builder; remove every bind mount on exit.
          mounted=()
          cleanup_devices() {
            for ((i=${#mounted[@]}-1; i>=0; i--)); do
              sudo umount "${mounted[i]}"
              sudo rm -f "${mounted[i]}"
            done
          }
          trap cleanup_devices EXIT
          sudo mkdir -p "$ROOT/dev"
          for device in null zero random urandom tty; do
            target="$ROOT/dev/$device"
            test ! -e "$target" && test ! -L "$target"
            sudo touch "$target"
            sudo mount --bind "/dev/$device" "$target"
            mounted+=("$target")
          done
          sudo install -m 0755 /usr/bin/qemu-mipsel-static "$ROOT/usr/bin/qemu-mipsel-static"
          sudo cp /etc/resolv.conf "$ROOT/etc/resolv.conf"
          sudo mkdir -p "$ROOT/tmp/retrode3-debs"
          sudo cp build/apt-debs/*.deb "$ROOT/tmp/retrode3-debs/"
          sudo sh -c 'printf "#!/bin/sh\nexit 101\n" > "$1"' sh "$ROOT/usr/sbin/policy-rc.d"
          sudo chmod 0755 "$ROOT/usr/sbin/policy-rc.d"
          sudo chroot "$ROOT" apt-get update
          sudo chroot "$ROOT" /bin/sh -c \
            'apt-get -y --no-install-recommends install /tmp/retrode3-debs/*.deb'
          sudo chroot "$ROOT" dpkg --audit
          # Verify *every* discovered dynamic OSCR core and every all-arch
          # support package in the exact candidate manifest, not a fixed list.
          mapfile -t pinned < <(python3 - <<'PY_PACKAGES'
          import json
          data = json.load(open("build/apt-debs/build-manifest.json"))
          names = [record["package"] for record in data["packages"]]
          required = {"retrode3-core-runtime", "retrode3-web-control",
                      "retrode3-tools", "retrode3-udev-rules"}
          assert required.issubset(names), "Missing required image packages"
          assert len(names) == len(set(names)), "Duplicate package records"
          for name in sorted(names):
              print(name)
          PY_PACKAGES
          )
          sudo chroot "$ROOT" dpkg-query -W "${pinned[@]}" \
            apache2 libapache2-mod-php8.2 php8.2-cli
          if sudo chroot "$ROOT" dpkg-query -W -f='${Status}' systemd-sysv 2>/dev/null \
            | grep -q 'install ok installed'; then
            echo "systemd-sysv incorrectly installed in SysV rootfs" >&2
            exit 1
          fi
          # Do not leak the emulator, package installation helper or DNS file.
          sudo rm -f "$ROOT/usr/bin/qemu-mipsel-static" \
            "$ROOT/usr/sbin/policy-rc.d" "$ROOT/etc/resolv.conf"
          sudo rm -rf "$ROOT/tmp/retrode3-debs"
          sudo python3 image/verify-rootfs.py --with-retrode3 "$ROOT"
      - name: Explain test limitations
        run: |
          echo "Verified: package dependency closure and maintainer scripts in Debian 12 MIPSEL."
          echo "Not verified: kernel, U-Boot, WLAN connect, USB gadgets or physical Retrode3."
